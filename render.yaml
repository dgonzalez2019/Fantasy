# One-click deploy config for Render (https://render.com).
# Create a Blueprint from this repo, then fill in the values marked sync:false
# in the dashboard - they are secrets and must not live in git.
services:
  - type: web
    name: rotobot
    runtime: node
    plan: free
    buildCommand: npm ci --omit=optional
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: ROTOBOT_HOSTED
        value: "1"
      - key: NODE_ENV
        value: production
      # Required. Without this the site is open to anyone who finds the URL.
      - key: ROTOBOT_ACCESS_CODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional - only needed for Yahoo login.
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        sync: false
    # Linked accounts live on disk; without this they reset on every deploy.
    disk:
      name: rotobot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
