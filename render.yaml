# One-click deploy config for Render (https://render.com).
# Create a Blueprint from this repo, then fill in the values marked sync:false
# in the dashboard - they are secrets and must not live in git.
services:
  - type: web
    name: rotobot
    runtime: node
    plan: free
    buildCommand: npm ci --omit=optional
    startCommand: node server/index.js
    # Must be the unauthenticated probe - /api/health sits behind the access gate
    # and would fail every health check with a 401.
    healthCheckPath: /api/ping
    envVars:
      - key: ROTOBOT_HOSTED
        value: "1"
      - key: NODE_ENV
        value: production
      # Required. Without this the site is open to anyone who finds the URL.
      - key: ROTOBOT_ACCESS_CODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional - only needed for Yahoo login.
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        sync: false
    # NOTE: linked accounts are stored in data/ on local disk, which is ephemeral
    # here. On the free plan you'll re-link after a redeploy or a spin-down —
    # annoying, not destructive. Render only allows persistent disks on paid
    # instances, so to keep them, move to a Starter plan and add:
    #
    #   disk:
    #     name: rotobot-data
    #     mountPath: /opt/render/project/src/data
    #     sizeGB: 1
